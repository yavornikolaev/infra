apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yavornikolaev/infra.git
    targetRevision: master
    path: argocd/applications
    directory:
      recurse: true
      include: "*application*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
