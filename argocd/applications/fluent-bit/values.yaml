# Minimal Fluent Bit to send Kubernetes logs to Loki

fluent-bit:
  serviceMonitor:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Fluent Bit chart uses classic mode config blocks
  config:
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On

      # Drop kube-system logs to save resources (optional)
      [FILTER]
          Name    grep
          Match   kube.*
          Exclude namespace_name kube-system

    outputs: |
      [OUTPUT]
          Name        loki
          Match       kube.*
          Host        loki.logging.svc.cluster.local
          Port        3100
          Labels      job=fluent-bit,cluster=aks-dev
          label_keys  $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']
          line_format json

      [OUTPUT]
          Name        loki
          Match       host.*
          Host        loki.logging.svc.cluster.local
          Port        3100
          Labels      job=node,cluster=aks-dev
          line_format json
