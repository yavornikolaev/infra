# Values are passed to the "loki" dependency chart.
loki:
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
    persistence:
      enabled: true
      size: 5Gi

  read:
    replicas: 0

  write:
    replicas: 0

  backend:
    replicas: 0

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: filesystem
    limits_config:
      retention_period: 24h

  gateway:
    enabled: false

  monitoring:
    dashboards:
      enabled: true
    rules:
      enabled: false
    serviceMonitor:
      enabled: false
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

  test:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  ruler:
    enabled: false
