# Cost-optimized defaults. Adjust as needed.

kube-prometheus-stack:
  alertmanager:
    enabled: false

  grafana:
    replicas: 1
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      size: 2Gi
    adminPassword: "admin"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        editable: true
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: "1"

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 6h
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 256Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  nodeExporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
