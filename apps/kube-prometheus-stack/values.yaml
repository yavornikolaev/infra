# Cost-optimized defaults. Adjust as needed.

kube-prometheus-stack:
  crds:
    enabled: false

  alertmanager:
    enabled: false

  grafana:
    replicas: 1
    persistence:
      enabled: true
      size: 2Gi

  prometheus:
    prometheusSpec:
      retention: 6h
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi

  nodeExporter:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
